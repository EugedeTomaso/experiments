<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ node_title }} — {{ project_name }}</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, -apple-system, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.75;
      color: #1a1a1a;
      background: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ---- Layout ---- */
    .page-wrapper {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid #e5e5e3;
      padding: 32px 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #6b6b6b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0 24px 16px;
    }

    .sidebar nav {
      display: flex;
      flex-direction: column;
    }

    .sidebar nav a {
      display: block;
      padding: 6px 24px;
      font-size: 0.875rem;
      color: #1a1a1a;
      text-decoration: none;
      line-height: 1.5;
      transition: background 0.1s;
    }

    .sidebar nav a:hover {
      background: #f9f9f8;
    }

    .sidebar nav a.active {
      background: #f3f3f1;
      font-weight: 500;
    }

    .sidebar nav a.depth-1 { padding-left: 40px; }
    .sidebar nav a.depth-2 { padding-left: 56px; }
    .sidebar nav a.depth-3 { padding-left: 72px; }
    .sidebar nav a.depth-4 { padding-left: 88px; }
    .sidebar nav a.depth-5 { padding-left: 104px; }

    .content-area {
      flex: 1;
      min-width: 0;
      padding: 48px 32px 96px;
      display: flex;
      justify-content: center;
    }

    .article {
      max-width: 720px;
      width: 100%;
    }

    /* ---- Mobile nav ---- */
    .mobile-nav {
      display: none;
      border-bottom: 1px solid #e5e5e3;
      padding: 12px 16px;
    }

    .mobile-nav summary {
      font-size: 0.875rem;
      font-weight: 500;
      color: #6b6b6b;
      cursor: pointer;
      list-style: none;
    }

    .mobile-nav summary::-webkit-details-marker {
      display: none;
    }

    .mobile-nav summary::before {
      content: "\25B6\00a0";
      font-size: 0.625rem;
      vertical-align: middle;
    }

    .mobile-nav[open] summary::before {
      content: "\25BC\00a0";
    }

    .mobile-nav nav {
      padding: 8px 0;
      display: flex;
      flex-direction: column;
    }

    .mobile-nav nav a {
      display: block;
      padding: 6px 8px;
      font-size: 0.875rem;
      color: #1a1a1a;
      text-decoration: none;
      border-radius: 4px;
    }

    .mobile-nav nav a:hover {
      background: #f9f9f8;
    }

    .mobile-nav nav a.active {
      background: #f3f3f1;
      font-weight: 500;
    }

    .mobile-nav nav a.depth-1 { padding-left: 24px; }
    .mobile-nav nav a.depth-2 { padding-left: 40px; }
    .mobile-nav nav a.depth-3 { padding-left: 56px; }
    .mobile-nav nav a.depth-4 { padding-left: 72px; }
    .mobile-nav nav a.depth-5 { padding-left: 88px; }

    /* ---- Typography ---- */
    .article h1 {
      font-size: 2.25rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    .article h2 {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.015em;
      margin-top: 48px;
      margin-bottom: 16px;
    }

    .article h3 {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -0.01em;
      margin-top: 36px;
      margin-bottom: 12px;
    }

    .article h4, .article h5, .article h6 {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.5;
      margin-top: 24px;
      margin-bottom: 8px;
    }

    .article p {
      margin-bottom: 16px;
    }

    .article ul, .article ol {
      margin-bottom: 16px;
      padding-left: 24px;
    }

    .article li {
      margin-bottom: 4px;
    }

    .article li > ul, .article li > ol {
      margin-top: 4px;
      margin-bottom: 4px;
    }

    /* ---- Links ---- */
    .article a {
      color: #1a73e8;
      text-decoration: none;
    }

    .article a:hover {
      text-decoration: underline;
    }

    /* ---- Code ---- */
    .article code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.875em;
      background: #f4f4f2;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .article pre {
      background: #f4f4f2;
      border-radius: 6px;
      padding: 16px 20px;
      overflow-x: auto;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .article pre code {
      background: none;
      padding: 0;
      border-radius: 0;
      font-size: 0.8125rem;
    }

    /* ---- Blockquotes ---- */
    .article blockquote {
      border-left: 3px solid #e5e5e3;
      padding-left: 16px;
      margin-bottom: 16px;
      color: #4a4a4a;
    }

    /* ---- Tables ---- */
    .article table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 0.9375rem;
    }

    .article th, .article td {
      border: 1px solid #e5e5e3;
      padding: 8px 12px;
      text-align: left;
    }

    .article th {
      background: #f9f9f8;
      font-weight: 600;
    }

    /* ---- Images ---- */
    .article img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }

    /* ---- Horizontal rule ---- */
    .article hr {
      border: none;
      border-top: 1px solid #e5e5e3;
      margin: 32px 0;
    }

    /* ---- Responsive ---- */
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .mobile-nav {
        display: block;
      }

      .content-area {
        padding: 32px 16px 64px;
      }

      .article h1 {
        font-size: 1.75rem;
      }

      .article h2 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  {% if is_multi_node %}
  <details class="mobile-nav">
    <summary>{{ project_name }} — Navigation</summary>
    <nav>
      {% for nav in nav_nodes %}
      <a href="{{ base_url }}{{ nav.id }}/" class="depth-{{ nav.depth }}{% if nav.active %} active{% endif %}">{{ nav.title }}</a>
      {% endfor %}
    </nav>
  </details>
  {% endif %}

  <div class="page-wrapper">
    {% if is_multi_node %}
    <aside class="sidebar">
      <div class="sidebar-title">{{ project_name }}</div>
      <nav>
        {% for nav in nav_nodes %}
        <a href="{{ base_url }}{{ nav.id }}/" class="depth-{{ nav.depth }}{% if nav.active %} active{% endif %}">{{ nav.title }}</a>
        {% endfor %}
      </nav>
    </aside>
    {% endif %}

    <main class="content-area">
      <article class="article">
        {{ body_html|safe }}
      </article>
    </main>
  </div>
</body>
</html>
