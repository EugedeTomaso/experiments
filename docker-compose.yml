version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: app
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-s0LCwfe5XXrkm0KD-jNNAw4VolMipNOSZAK2xBGijVU=}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: "http://localhost:8000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  collab:
    build: ./collab
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-key-change-me}
      DJANGO_API_URL: http://backend:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      PORT: 4444
    ports:
      - "4444:4444"
    depends_on:
      - backend

volumes:
  db_data:
